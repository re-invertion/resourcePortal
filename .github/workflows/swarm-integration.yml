name: Real Docker Swarm Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-swarm:
    name: Real Swarm smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: resource_portal
          POSTGRES_PASSWORD: resource_portal
          POSTGRES_DB: resource_portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U resource_portal -d resource_portal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      PORT: 3000
      DATABASE_URL: postgresql://resource_portal:resource_portal@127.0.0.1:5432/resource_portal?schema=public
      AUTH_MODE: dev
      RESOURCE_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      RESOURCE_STORAGE_ROOT: /tmp/resource-portal/rp/volumes
      RESOURCE_SECRET_STORAGE_ROOT: /tmp/resource-portal/secrets
      RESOURCE_PORTAL_API_URL: http://127.0.0.1:3000/api
      CEPHFS_MOUNT_ROOT: /tmp/resource-portal
      CEPH_CLI: ${{ github.workspace }}/scripts/ci/fake-ceph.sh
      CEPHFS_SETXATTR_CLI: ${{ github.workspace }}/scripts/ci/fake-cephfs-setxattr.sh
      CEPHFS_GETXATTR_CLI: ${{ github.workspace }}/scripts/ci/fake-cephfs-getxattr.sh
      RP_FAKE_CEPH_QUOTA_STATE_DIR: /tmp/resource-portal/fake-ceph-quota
      NFS_GANESHA_SERVER: 127.0.0.1
      NFS_GANESHA_VERSION: "4.1"
      STORAGE_BACKEND_RECONCILE_INTERVAL_MS: 600000
      STORAGE_REMOTE_VALIDATION_ENABLED: "true"
      STORAGE_REMOTE_VALIDATION_TIMEOUT_MS: 120000
      STORAGE_REMOTE_VALIDATION_IMAGE: alpine:3.20
      TRAEFIK_CERT_RESOLVER: smoke-resolver
      DOCKER_CONTEXT: default
      DOCKER_APPLY_TIMEOUT_MS: 120000
      DOCKER_CONFIG_PROVISION_TIMEOUT_MS: 120000
      DOCKER_REGISTRY_AUTH_TIMEOUT_MS: 120000
      DOCKER_SECRET_PROVISION_TIMEOUT_MS: 120000
      DOCKER_VOLUME_PROVISION_TIMEOUT_MS: 120000
      DOCKER_RUNTIME_OPERATION_TIMEOUT_MS: 120000
      DOCKER_ROLLOUT_TIMEOUT_MS: 180000
      DOCKER_ROLLOUT_POLL_INTERVAL_MS: 2000
      WORKER_ID: github-actions-swarm
      WORKER_ONCE: "true"
      SMOKE_USER_ID: 11111111-1111-4111-8111-111111111111
      PLATFORM_ADMIN_USER_IDS: 11111111-1111-4111-8111-111111111111
      SWARM_INFRASTRUCTURE_RECONCILE_INTERVAL_MS: 600000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright for Stage 20 real-Swarm browser smoke
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npm run api:prisma:generate

      - name: Apply database migrations
        run: npm exec --workspace @resource-portal/api -- prisma migrate deploy

      - name: Seed RBAC roles
        run: npm run api:db:seed

      - name: Create smoke-test user
        working-directory: packages/resourceportal-api
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          const prisma = new PrismaClient();
          (async () => {
            await prisma.user.upsert({
              where: { id: process.env.SMOKE_USER_ID },
              create: {
                id: process.env.SMOKE_USER_ID,
                email: 'swarm-ci@example.local',
                displayName: 'Swarm CI',
                status: 'Active',
              },
              update: { status: 'Active' },
            });
          })()
            .finally(() => prisma.$disconnect())
            .catch((error) => {
              console.error(error);
              process.exit(1);
            });
          NODE

      - name: Prepare Stage 14 storage harness
        run: |
          sudo apt-get update
          sudo apt-get install -y nfs-ganesha nfs-ganesha-vfs nfs-common
          sudo systemctl stop nfs-ganesha 2>/dev/null || true
          chmod +x \
            scripts/ci/fake-ceph.sh \
            scripts/ci/fake-cephfs-setxattr.sh \
            scripts/ci/fake-cephfs-getxattr.sh
          mkdir -p \
            "$RESOURCE_STORAGE_ROOT" \
            "$RESOURCE_SECRET_STORAGE_ROOT" \
            "$RP_FAKE_CEPH_QUOTA_STATE_DIR"
          sudo mkdir -p /run/ganesha "$CEPHFS_MOUNT_ROOT/rp/volumes" "$CEPHFS_MOUNT_ROOT/rp/secrets"
          sudo tee /etc/ganesha/ganesha.conf >/dev/null <<EOF
          NFS_Core_Param {
            Protocols = 4;
          }

          EXPORT {
            Export_Id = 14;
            Path = $CEPHFS_MOUNT_ROOT/rp;
            Pseudo = /rp;
            Protocols = 4;
            Transports = TCP;
            Access_Type = RW;
            Squash = None;
            SecType = sys;
            FSAL {
              Name = VFS;
            }
          }
          EOF

          sudo sh -c "ganesha.nfsd -F -f /etc/ganesha/ganesha.conf -L '$RUNNER_TEMP/nfs-ganesha.log' >/dev/null 2>&1 & echo \$! > '$RUNNER_TEMP/nfs-ganesha.pid'"

          for attempt in $(seq 1 30); do
            if sudo ss -ltn | grep -q ':2049 '; then
              break
            fi
            sleep 1
          done
          sudo ss -ltn | grep ':2049 '

          sudo mkdir -p /tmp/resource-portal-nfs-probe
          sudo mount -t nfs -o vers=4.1 127.0.0.1:/rp /tmp/resource-portal-nfs-probe
          printf ok | sudo tee /tmp/resource-portal-nfs-probe/.rp-stage14-probe >/dev/null
          test "$(sudo cat "$CEPHFS_MOUNT_ROOT/rp/.rp-stage14-probe")" = ok
          sudo rm -f /tmp/resource-portal-nfs-probe/.rp-stage14-probe
          sudo umount /tmp/resource-portal-nfs-probe

      - name: Initialize real Docker Swarm
        run: |
          docker info
          docker swarm init
          docker node ls
          test "$(docker info --format '{{.Swarm.LocalNodeState}} {{.Swarm.ControlAvailable}}')" = "active true"

      - name: Build Stage 20 Web Console
        env:
          NODE_ENV: production
        run: npm --workspace @resource-portal/web run build

      - name: Start Resource Portal API
        run: |
          npm run api:start > "$RUNNER_TEMP/resource-portal-api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/resource-portal-api.pid"

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:3000/api/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/resource-portal-api.log"
          exit 1

      - name: Start Stage 20 Web Console
        env:
          PORT: 4173
          RESOURCE_PORTAL_API_ORIGIN: http://127.0.0.1:3000
        run: |
          npm --workspace @resource-portal/web run start > "$RUNNER_TEMP/resource-portal-web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/resource-portal-web.pid"

          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat "$RUNNER_TEMP/resource-portal-web.log"
          exit 1

      - name: Reconcile Swarm capacity for Stage 20 browser smoke
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "x-dev-user-id: $SMOKE_USER_ID" \
            http://127.0.0.1:3000/api/platform/swarm-cluster/reconcile

      - name: Run Stage 20 browser smoke against real Swarm
        env:
          STAGE20_REAL_SWARM_WEB_ORIGIN: http://127.0.0.1:4173
        run: node scripts/run-stage20-real-swarm-web-e2e.mjs

      - name: Verify Stage 20 management matrix
        env:
          STAGE20_REAL_SWARM_WEB_ORIGIN: http://127.0.0.1:4173
        run: node scripts/verify-stage20-management-matrix.mjs

      - name: Run Resource Portal against real Swarm
        run: bash scripts/run-real-swarm-smoke.sh

      - name: Verify Swarm is clean after smoke test
        if: always()
        run: |
          echo "Services:"
          docker service ls || true
          echo "Stacks:"
          docker stack ls || true
          echo "Secrets:"
          docker secret ls || true
          echo "Configs:"
          docker config ls || true
          echo "Volumes:"
          docker volume ls || true

          if docker stack ls --format '{{.Name}}' | grep -q '^rp_'; then
            echo 'Resource Portal stack leaked after smoke test'
            exit 1
          fi

      - name: Upload integration logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-portal-swarm-integration-logs
          path: |
            ${{ runner.temp }}/resource-portal-api.log
            ${{ runner.temp }}/resource-portal-web.log
            ${{ runner.temp }}/nfs-ganesha.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop NFS-Ganesha
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/nfs-ganesha.pid"; then
            sudo kill "$(cat "$RUNNER_TEMP/nfs-ganesha.pid")" || true
          fi

      - name: Leave Swarm
        if: always()
        run: docker swarm leave --force || true
