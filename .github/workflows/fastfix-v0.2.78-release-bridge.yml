name: Fastfix v0.2.78 release bridge

on:
  workflow_run:
    workflows: ["ResourcePortal Fast Fix"]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: fastfix-v0.2.78-tag
  cancel-in-progress: false

jobs:
  dispatch-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exactly the validated main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate explicitly approved release commit
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$VALIDATED_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$VALIDATED_SHA" ]] ||
            { echo "main advanced after the validated run" >&2; exit 1; }
          message="$(git log -1 --format=%B)"
          [[ "$message" == *'[fastfix]'* && "$message" == *'[release-v0.2.78]'* ]] ||
            { echo "Not an authorized v0.2.78 release commit" >&2; exit 1; }
          node scripts/release-validation-mode.mjs --version v0.2.78 --require fastfix
      - name: Publish existing verified v0.2.78 tag via official release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # The original bridge already created this immutable annotated tag.
          # Do not retag newer main commits: publish the exact previously validated artifact source.
          tag_target="$(git rev-parse 'refs/tags/v0.2.78^{commit}')"
          [[ "$tag_target" == 'b2a1ef3c765c286a31e5aab604df8aec0feaa3f5' ]] ||
            { echo "v0.2.78 tag target has unexpectedly changed" >&2; exit 1; }
          if gh release view v0.2.78 >/dev/null 2>&1; then
            echo "v0.2.78 is already published; do not dispatch again"
            exit 0
          fi
          # The workflow_dispatch ref must target the immutable tag, not a newer main.
          gh workflow run release.yml --ref v0.2.78 --field version=0.2.78
