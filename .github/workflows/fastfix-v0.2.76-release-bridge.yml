name: Fastfix v0.2.76 release bridge

on:
  workflow_run:
    workflows: ["ResourcePortal Fast Fix"]
    types: [completed]

permissions:
  contents: write
  actions: write

concurrency:
  group: fastfix-v0.2.76-tag
  cancel-in-progress: false

jobs:
  dispatch-release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exactly the validated main revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate explicitly approved release commit
        env:
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$VALIDATED_SHA" ]]
          [[ "$(git ls-remote origin refs/heads/main | cut -f1)" == "$VALIDATED_SHA" ]] ||
            { echo "main advanced after the validated run" >&2; exit 1; }
          message="$(git log -1 --format=%B)"
          [[ "$message" == *'[fastfix]'* && "$message" == *'[release-v0.2.76]'* ]] ||
            { echo "Not an authorized v0.2.76 release commit" >&2; exit 1; }
          node scripts/release-validation-mode.mjs --version v0.2.76 --require fastfix
      - name: Tag and explicitly dispatch official release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git ls-remote --tags origin refs/tags/v0.2.76)" ]]; then
            echo "v0.2.76 already tagged; do not dispatch twice"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a v0.2.76 "$VALIDATED_SHA" -m 'ResourcePortal v0.2.76 secure upgrade checkpoint and rollback release'
          git push origin refs/tags/v0.2.76
          # GITHUB_TOKEN-created tag pushes do not start workflows; dispatch is explicit.
          gh workflow run release.yml --ref main --field version=0.2.76
