name: Tenant OIDC Real HTTPS ZITADEL E2E

on:
  pull_request:
    paths:
      - '.github/workflows/tenant-oidc-live.yml'
      - 'packages/resourceportal-api/src/tenant-oidc/**'
      - 'packages/resourceportal-api/src/oauth-applications/**'
      - 'packages/resourceportal-api/scripts/tenant-oidc-live-e2e.ts'
      - 'packages/resourceportal-api/prisma/**'
      - 'scripts/run-tenant-oidc-https-e2e.sh'
      - 'test/tenant-oidc/**'
      - 'test/federation/**'
      - 'package-lock.json'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  real-https-project-grants:
    name: Real HTTPS issuer, tenant projects, membership and revocation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TENANT_OIDC_E2E_ISOLATED: 'true'
      GITHUB_ACTIONS: 'true'
      ZITADEL_VERSION: v4.17.0
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact dependencies and generate Prisma
        run: |
          npm ci --no-audit --no-fund
          npm run api:prisma:generate
      - name: Install isolated Chromium for real OIDC PKCE login
        run: npx playwright install --with-deps chromium
      - name: Test isolated HTTPS tenant OIDC against real pinned ZITADEL
        shell: bash
        run: bash scripts/run-tenant-oidc-https-e2e.sh
      - name: Confirm the test never enabled production SSO
        if: always()
        shell: bash
        run: |
          ! grep -Rq '^TENANT_OIDC_ACTIVATION_ALLOWED=true' .env 2>/dev/null || exit 1
          ! grep -Rq '^RP_NATIVE_LOGIN_ONLY=true' .env 2>/dev/null || exit 1
