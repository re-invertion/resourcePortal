name: Production Installer Quality Gate

on:
  workflow_call:
    inputs:
      force_gate:
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

# Called by Release Readiness on both PR synchronize and review events.
# A PR review runs a NEW required check on the SAME ref. Scoping to ref
# would cancel the earlier run's still-running required installer/Swarm gates,
# producing a false failed Required release readiness check. Retain isolated
# runs instead; the caller still requires every applicable gate to succeed.
concurrency:
  group: production-installer-${{ github.workflow }}-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  installer-quality:
    if: inputs.force_gate == true || github.event_name == 'workflow_dispatch'
    name: Installer contracts, ACME safety, and shell quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install installer validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck

      - name: Validate shell syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in resourceportal-install.sh scripts/installer/*.sh packages/resourceportal-postgres/postgres-fence.sh test/installer/*.sh; do
            bash -n "$file"
          done

      - name: Run ShellCheck
        run: shellcheck --severity=warning -x resourceportal-install.sh scripts/installer/*.sh packages/resourceportal-postgres/postgres-fence.sh test/installer/*.sh

      - name: Run complete Production Installer regression suite
        run: npm run test:installer

      - name: Confirm ACME rate-limit and reinstall resilience
        run: bash test/installer/test-acme-resilience.sh