name: Live Federation Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  federation-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ZITADEL_VERSION: v4.17.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run api:prisma:generate

      - name: Install Playwright for live browser login
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run live ZITADEL federation E2E
        run: bash scripts/run-federation-e2e.sh
