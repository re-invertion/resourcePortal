name: Live Federation Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  federation-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ZITADEL_VERSION: v4.17.0
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright for live browser login
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Generate Prisma client
        run: npm run api:prisma:generate

      - name: Start ZITADEL and Keycloak
        run: bash scripts/run-federation-e2e.sh services

      - name: Bootstrap Resource Portal in ZITADEL
        id: bootstrap
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/run-federation-e2e.sh bootstrap 2>&1 | tee var/federation/bootstrap.log

      - name: Report bootstrap failure
        if: steps.bootstrap.outcome == 'failure' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo 'Live federation bootstrap failed. Diagnostic tail:'
            echo '```text'
            tail -n 30 var/federation/bootstrap.log
            echo '```'
          } > /tmp/federation-bootstrap-failure.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/federation-bootstrap-failure.md
          exit 1

      - name: Fail bootstrap outside pull requests
        if: steps.bootstrap.outcome == 'failure' && github.event_name != 'pull_request'
        run: exit 1

      - name: Migrate and seed Resource Portal database
        run: bash scripts/run-federation-e2e.sh database

      - name: Build Resource Portal API and Web Console
        run: bash scripts/run-federation-e2e.sh build

      - name: Provision tenant OIDC and SAML providers
        run: bash scripts/run-federation-e2e.sh provision

      - name: Login and exercise Web Console in Chromium
        run: bash scripts/run-federation-e2e.sh browser

      - name: Cleanup federation environment
        if: always()
        run: bash scripts/run-federation-e2e.sh cleanup