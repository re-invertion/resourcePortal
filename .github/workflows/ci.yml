name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://resource_portal:resource_portal@localhost:5432/resource_portal?schema=public
      AUTH_MODE: dev
      RESOURCE_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Generate Prisma client
        run: npm run api:prisma:generate
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
      - name: Build API runtime image
        run: docker build -t resourceportal-api-ci .
      - name: Verify storage tools in API runtime image
        run: |
          docker run --rm --user root --entrypoint /bin/sh resourceportal-api-ci -c '
            command -v findmnt &&
            command -v xfs_quota &&
            command -v setquota &&
            command -v chattr &&
            command -v lsattr
          '
      - name: Verify API image remains non-root by default
        run: |
          test "$(docker run --rm --entrypoint /usr/bin/id resourceportal-api-ci -u)" != "0"
