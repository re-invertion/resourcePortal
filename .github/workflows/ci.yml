name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://resource_portal:resource_portal@localhost:5432/resource_portal?schema=public
      AUTH_MODE: dev
      RESOURCE_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        continue-on-error: true
        run: npm audit --audit-level=high
      - name: Generate Prisma client
        run: npm run api:prisma:generate
      - name: Lint
        continue-on-error: true
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build
