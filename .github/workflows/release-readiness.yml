name: ResourcePortal Release Readiness

on:
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read
  # The called Federation gate may comment on failed PR browser tests.
  pull-requests: write

jobs:
  candidate:
    name: Build and validate release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      mode: ${{ steps.release-mode.outputs.mode }}
      vpn_smoke: ${{ steps.test-plan.outputs.vpn_smoke }}
      gpu_smoke: ${{ steps.test-plan.outputs.gpu_smoke }}
      federation_required: ${{ steps.test-plan.outputs.federation_required }}
      installer_required: ${{ steps.test-plan.outputs.installer_required }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Block merges while the previous main release is unpublished
        id: release-mode
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          previous_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          previous_sha="$(git rev-list -n 1 "$previous_tag")"
          main_sha="$(git rev-parse origin/main)"
          if [[ "$previous_sha" != "$main_sha" ]]; then
            # ONE-TIME SECURITY RECOVERY: #349 passed protected merge checks,
            # but npm audit correctly prevented its post-merge publication.
            # Only the exact reviewed dependency patch for #356 can recover
            # the backlog. No other unpublished main commit or file is allowed.
            # Existing lint, full tests, rollback, Swarm, signing and
            # post-merge audit gates continue to execute without overrides.
            if [[ "$previous_tag" == "v0.2.118" &&
                  "$previous_sha" == "e3155f1cb3e77a28a513f9e6f305d2cd4f03c754" &&
                  "$main_sha" == "52202280c92bb536080c5382e2de199dde93d21e" ]]; then
              recovery_diff="$(git diff --name-only "$main_sha" HEAD | LC_ALL=C sort)"
              allowed_diff="$(printf '%s\n' \
                '.github/workflows/release-readiness.yml' \
                'package-lock.json' \
                'packages/resourceportal-api/package.json' \
                'packages/resourceportal-web/package.json' \
                'test/test-workflow-gates.test.mjs' | LC_ALL=C sort)"
              if [[ "$recovery_diff" != "$allowed_diff" ]]; then
                echo "Security recovery accepts only the exact reviewed #356 dependency and gate changes." >&2
                exit 1
              fi
              for pair in \
                'package-lock.json:ddea2fe95c57b6bc5a747239831bd97228314fdb' \
                'packages/resourceportal-api/package.json:b5dd485d7f87ed374351e820fc0a24cdcda7dd4f' \
                'packages/resourceportal-web/package.json:500db66dc22b0ff97625e0c3b3c9def99842e686'; do
                path="${pair%%:*}"
                expected="${pair#*:}"
                if [[ "$(git rev-parse "HEAD:$path")" != "$expected" ]]; then
                  echo "Security recovery dependency blob mismatch ($path)." >&2
                  exit 1
                fi
              done
              echo "::notice::One-time approved #356 security recovery; all full release checks remain mandatory."
            else
            # ONE-TIME RELEASE BACKLOG RECOVERY: #317 passed protected merge
            # checks, but its signed main release failed on an expiring test
            # fixture. #318 fixes that fixture. Admit ONLY this known recovery
            # candidate through the freshness preflight; all remaining
            # pre-merge lint, tests, installer, rollback, Swarm and signing
            # requirements remain mandatory. This does not weaken rulesets
            # or allow a generic backlog exception.
            if [[ "$previous_tag" != "v0.2.97" ||
                  "$previous_sha" != "c98d22f68771c11e09843f4b87f0e25e65aee3df" ||
                  "$main_sha" != "0f2918dd86cdbadedf2e5178e09bc7e9d2979956" ]]; then
              echo "Current main commit has no published release. Resolve the publication backlog before merge." >&2
              exit 1
            fi
            recovery_diff="$(git diff --name-only "$main_sha" HEAD | LC_ALL=C sort)"
            allowed_diff="$(printf '%s\n' \
              '.github/workflows/release-readiness.yml' \
              'packages/resourceportal-api/src/billing/billing-voucher-codes.spec.ts' \
              'scripts/fastfix-test-plan.mjs' \
              'test/fastfix-test-plan.test.mjs' \
              'test/test-workflow-gates.test.mjs' | LC_ALL=C sort)"
            if [[ "$recovery_diff" != "$allowed_diff" ]]; then
              echo "Release recovery accepts only the explicitly reviewed #318 changes." >&2
              exit 1
            fi
            fixture_blob="$(git rev-parse HEAD:packages/resourceportal-api/src/billing/billing-voucher-codes.spec.ts)"
            if [[ "$fixture_blob" != "f2dfc5a72dc4ba981a6e2cb4b33d6d9a3ca9f86a" ]]; then
              echo "Release recovery fixture does not match the verified time-independent fix." >&2
              exit 1
            fi
            echo "::notice::One-time recovery for unpublished main #317; ALL remaining release checks still required."
            fi
          fi
          node scripts/next-main-release.mjs --github-output "$GITHUB_OUTPUT"
      - name: Install dependencies and generate Prisma
        run: |
          npm ci
          npm run api:prisma:generate
      - name: Validate release selection and test taxonomy
        id: test-plan
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          npm run test:catalog
          node --test test/next-main-release.test.mjs test/release-validation-mode.test.mjs test/test-workflow-gates.test.mjs
          previous_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          node scripts/fastfix-test-plan.mjs --base "$previous_tag" --head HEAD --github-output "$GITHUB_OUTPUT"
      - name: Validate all source code, test suites and packages
        if: steps.release-mode.outputs.mode == 'milestone'
        run: |
          npm audit --audit-level=high
          npm run lint
          npm run test
          npm run build
          npm run test:installer
          npm run test:cli-release
      - name: Validate affected patch scope without unrelated project-wide functional suites
        if: steps.release-mode.outputs.mode == 'fastfix'
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://resource_portal:resource_portal@localhost:5432/resource_portal?schema=public
          AUTH_MODE: dev
          RESOURCE_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          node scripts/fastfix-test-plan.mjs --base "$previous_tag" --head HEAD --run
      - name: Require complete regression suite for every Fast Fix before merge
        if: steps.release-mode.outputs.mode == 'fastfix'
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://resource_portal:resource_portal@localhost:5432/resource_portal?schema=public
          AUTH_MODE: dev
          RESOURCE_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: |
          # Targeted tests above are useful but never substitute for the full suite.
          # Patch releases must also pass the exact same dependency security
          # threshold as post-merge CI before they can enter the merge queue.
          npm audit --audit-level=high
          npm run lint
          npm run test
          npm run build
          npm run test:installer
          npm run test:cli-release
      - name: Dry-run actual installable CLI packaging
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/next-main-release.mjs | jq -er .version)"
          npm run build --workspace @resource-portal/sdk
          npm run build --workspace @resource-portal/cli
          scripts/package-cli-release.sh "$version" \
            packages/resourceportal-cli/dist packages/resourceportal-sdk/dist cli-release
          (cd cli-release && sha256sum -c SHA256SUMS)
          prefix="$(mktemp -d)"
          trap 'rm -rf "$prefix"' EXIT
          npm install --global --prefix "$prefix" "./cli-release/resource-portal-cli-${version}.tgz"
          "$prefix/bin/rp" --help
      - name: Build the three production release images before merge
        run: |
          set -euo pipefail
          docker build -t resourceportal-api-candidate .
          docker build -t resourceportal-web-candidate -f packages/resourceportal-web/Dockerfile .
          docker build -t resourceportal-postgres-candidate -f packages/resourceportal-postgres/Dockerfile .
          docker run --rm --entrypoint /bin/bash resourceportal-postgres-candidate \
            -ec 'command -v flock && test -x /usr/local/bin/resourceportal-postgres-fence'
          test "$(docker run --rm --entrypoint /usr/bin/id resourceportal-api-candidate -u)" != "0"

      - name: Verify automatic rollback of published and candidate ResourcePortal images
        env:
          PREVIOUS_TAG: ${{ steps.release-mode.outputs.previous_tag }}
          RP_ROLLBACK_EVIDENCE_OUTPUT: ${{ runner.temp }}/rp-rollback-evidence.json
          RP_ROLLBACK_E2E_ISOLATED: 'true'
          # Must match immutable version resolved by the release workflow.
          RP_ROLLBACK_CANDIDATE_ZITADEL_IMAGE: ghcr.io/zitadel/zitadel:v4.17.0
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/run-automatic-rollback-smoke.sh "${PREVIOUS_TAG#v}"

      - name: Require verified automatic rollback before allowing merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')"
          node scripts/release-rollback-policy.mjs \
            --previous-tag "$previous_tag" \
            --head HEAD \
            --mode "${{ steps.release-mode.outputs.mode }}" \
            --verified-evidence-file "$RUNNER_TEMP/rp-rollback-evidence.json" \
            --require-automatic

  swarm:
    name: Real Swarm gate
    needs: candidate
    if: needs.candidate.outputs.mode == 'milestone' || needs.candidate.outputs.vpn_smoke == 'true'
    uses: ./.github/workflows/swarm-integration.yml
    with:
      force_gate: true

  federation:
    name: Federation and browser gate
    needs: candidate
    if: needs.candidate.outputs.mode == 'milestone' || needs.candidate.outputs.federation_required == 'true'
    uses: ./.github/workflows/federation-integration.yml
    with:
      force_gate: true

  tenant-oidc:
    name: Real HTTPS tenant OIDC gate
    needs: candidate
    if: needs.candidate.outputs.mode == 'milestone' || needs.candidate.outputs.federation_required == 'true'
    uses: ./.github/workflows/tenant-oidc-live.yml

  installer:
    name: Production installer gate
    needs: candidate
    if: needs.candidate.outputs.mode == 'milestone' || needs.candidate.outputs.installer_required == 'true'
    uses: ./.github/workflows/production-installer.yml
    with:
      force_gate: true

  gpu-physical:
    name: Physical NVIDIA Swarm isolation gate
    needs: candidate
    # Never run untrusted fork PR code on a private physical GPU runner.
    if: needs.candidate.outputs.gpu_smoke == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, rp-isolated-nvidia-gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prove single-device exclusivity and CPU-only isolation on an isolated GPU Swarm
        env:
          RP_GPU_SMOKE_ACK: isolated-nonproduction-swarm
        run: bash scripts/test-nvidia-gpu-swarm.sh

  release-ready:
    name: Required release readiness
    runs-on: ubuntu-latest
    if: always()
    needs: [candidate, swarm, federation, installer, tenant-oidc, gpu-physical]
    steps:
      - name: Fail closed unless all applicable pre-merge checks succeeded
        env:
          CANDIDATE: ${{ needs.candidate.result }}
          MODE: ${{ needs.candidate.outputs.mode }}
          VPN_SMOKE: ${{ needs.candidate.outputs.vpn_smoke }}
          GPU_SMOKE: ${{ needs.candidate.outputs.gpu_smoke }}
          FEDERATION_REQUIRED: ${{ needs.candidate.outputs.federation_required }}
          INSTALLER_REQUIRED: ${{ needs.candidate.outputs.installer_required }}
          SWARM: ${{ needs.swarm.result }}
          GPU_PHYSICAL: ${{ needs.gpu-physical.result }}
          FEDERATION: ${{ needs.federation.result }}
          INSTALLER: ${{ needs.installer.result }}
          TENANT_OIDC: ${{ needs.tenant-oidc.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE" == success ]] || { echo "Release candidate validation failed" >&2; exit 1; }
          [[ "$MODE" == fastfix || "$MODE" == milestone ]] || { echo "Unexpected release classification" >&2; exit 1; }
          verify_gate() {
            local name="$1" result="$2" required="$3"
            if [[ "$required" == true && "$result" != success ]]; then
              echo "Required $name gate not successful ($result)" >&2
              exit 1
            fi
            if [[ "$required" != true && "$result" != success && "$result" != skipped ]]; then
              echo "Optional $name gate failed ($result)" >&2
              exit 1
            fi
          }
          # GPU code requires physical GPU evidence in THIS PR/merge queue run.
          # A missing runner, skipped job, or failed isolation test blocks merge.
          if [[ "$GPU_SMOKE" == true ]]; then
            verify_gate physical-nvidia-swarm "$GPU_PHYSICAL" true
          else
            verify_gate physical-nvidia-swarm "$GPU_PHYSICAL" false
          fi
          if [[ "$MODE" == milestone || "$VPN_SMOKE" == true ]]; then
            verify_gate swarm "$SWARM" true
          else
            verify_gate swarm "$SWARM" false
          fi
          if [[ "$MODE" == milestone || "$FEDERATION_REQUIRED" == true ]]; then
            verify_gate federation "$FEDERATION" true
            verify_gate tenant-oidc "$TENANT_OIDC" true
          else
            verify_gate federation "$FEDERATION" false
            verify_gate tenant-oidc "$TENANT_OIDC" false
          fi
          if [[ "$MODE" == milestone || "$INSTALLER_REQUIRED" == true ]]; then
            verify_gate installer "$INSTALLER" true
          else
            verify_gate installer "$INSTALLER" false
          fi
