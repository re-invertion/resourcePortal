name: Emergency v0.2.56 Release Dispatch

on:
  push:
    branches:
      - fix/v0.2.56-critical-storage-quota
    paths:
      - .github/workflows/emergency-v0.2.56-release-dispatch.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Create immutable release tag at merged hotfix
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TARGET_SHA: 5152bff987b25f9120f90948c926b60d61db1442
          TAG: v0.2.56
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/$REPO"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          code="$(curl -sS -o /tmp/ref.json -w '%{http_code}' "${auth[@]}" "$api/git/ref/tags/$TAG")"
          if [[ "$code" == 200 ]]; then
            existing="$(jq -r '.object.sha' /tmp/ref.json)"
            echo "existing tag points to $existing"
            test "$existing" = "$TARGET_SHA"
          elif [[ "$code" == 404 ]]; then
            create_code="$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST "${auth[@]}"               "$api/git/refs"               -d "$(jq -nc --arg ref "refs/tags/$TAG" --arg sha "$TARGET_SHA" '{ref:$ref,sha:$sha}')")"
            cat /tmp/create.json
            test "$create_code" = 201
          else
            cat /tmp/ref.json
            exit 1
          fi

      - name: Dispatch installer-gated release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref v0.2.56 -f version=0.2.56
