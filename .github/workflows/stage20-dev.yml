name: Stage 20 Dev

on:
  push:
    branches: [feat/stage20-web-console]

permissions:
  contents: write

jobs:
  web-red-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/stage20-web-console
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install and refresh lockfile
        run: npm install
      - name: Persist generated lockfile
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add package-lock.json
            git commit -m "chore(stage20): refresh npm lockfile"
            git push
          fi
      - name: Web tests
        run: npm run test --workspace @resource-portal/web
      - name: Web typecheck and build
        run: |
          npm run lint --workspace @resource-portal/web
          npm run build --workspace @resource-portal/web
      - name: Production SSR deep-link smoke
        shell: bash
        run: |
          set -euo pipefail
          PORT=4173 HOST=127.0.0.1 NODE_ENV=production RESOURCE_PORTAL_API_ORIGIN=http://127.0.0.1:65535 node packages/resourceportal-web/server.mjs > /tmp/resourceportal-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/tenants/tenant-1/app-groups > /tmp/deep-link.html; then
              ready=1
              break
            fi
            sleep 0.25
          done
          if [ "$ready" -ne 1 ]; then
            cat /tmp/resourceportal-web.log
            exit 1
          fi

          grep -q 'data-route-kind="tenant"' /tmp/deep-link.html
          grep -q 'data-tenant-id="tenant-1"' /tmp/deep-link.html
          grep -q 'data-route-section="app-groups"' /tmp/deep-link.html
          grep -q 'Loading tenant route: app-groups' /tmp/deep-link.html

          status="$(curl --silent --output /tmp/not-found.html --write-out '%{http_code}' http://127.0.0.1:4173/definitely-not-a-resource-portal-route)"
          test "$status" = "404"
          grep -q 'data-route-kind="not-found"' /tmp/not-found.html
      - name: Dependency audit
        run: npm audit --audit-level=high
