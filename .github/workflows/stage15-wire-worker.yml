name: Stage 15 Wire Worker

on:
  push:
    branches: [feat/stage15-capacity-placement]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/stage15-capacity-placement
      - name: Apply deterministic Stage 15 worker wiring
        run: node .github/scripts/stage15-wire-worker.mjs
      - name: Commit worker wiring when needed
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/resourceportal-api/src/internal/deployment-worker.service.ts
          git commit -m "feat(stage15): wire atomic capacity admission [stage15-worker-wired]"
          git push origin HEAD:feat/stage15-capacity-placement
