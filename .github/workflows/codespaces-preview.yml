name: Codespaces Preview Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - "scripts/codespace-*.sh"
      - "packages/resourceportal-web/**"
      - "packages/resourceportal-api/**"
      - "docker-compose.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prepare Codespaces runtime
        run: bash scripts/codespace-setup.sh
      - name: Start Codespaces preview
        run: bash scripts/codespace-start.sh
      - name: Verify Web Console, proxy identity, and demo tenant
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error http://127.0.0.1:5173/health | grep -q "Resource Portal"
          curl --fail --silent --show-error http://127.0.0.1:5173/api/auth/me > /tmp/codespaces-me.json
          curl --fail --silent --show-error http://127.0.0.1:5173/api/tenants > /tmp/codespaces-tenants.json
          node - <<'EOF_NODE'
          const fs = require("node:fs");
          const me = JSON.parse(fs.readFileSync("/tmp/codespaces-me.json", "utf8"));
          if (me?.id !== "00000000-0000-4000-8000-000000000001") {
            throw new Error(`unexpected proxied development identity: ${JSON.stringify(me)}`);
          }
          const tenants = JSON.parse(fs.readFileSync("/tmp/codespaces-tenants.json", "utf8"));
          if (!Array.isArray(tenants) || !tenants.some((tenant) => tenant?.name === "codespace-demo")) {
            throw new Error("codespace-demo tenant was not visible through the Web Console proxy");
          }
          EOF_NODE
      - name: Show preview logs on failure
        if: failure()
        run: |
          find var/codespaces/logs -maxdepth 1 -type f -print -exec sh -c 'echo "--- $1"; tail -n 120 "$1"' _ {} \; || true
          docker compose --env-file var/codespaces/runtime.env ps || true
          docker compose --env-file var/codespaces/runtime.env logs postgres || true
