name: Installer-Gated Release

on:
  push:
    branches: [main]

concurrency:
  group: resourceportal-automatic-main-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  packages: write
  pull-requests: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.release-mode.outputs.mode }}
      version: ${{ steps.release-mode.outputs.version }}
      previous_tag: ${{ steps.release-mode.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve next unused version for this exact main revision
        id: release-mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/next-main-release.mjs --github-output "$GITHUB_OUTPUT"

  publish:
    needs: classify
    if: needs.classify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Node for Production Installer gate
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Require successful post-merge full CI for this exact main commit
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Separate main CI may finish after this release workflow starts.
          # Match the exact SHA and fail closed on failure, skip, cancellation or timeout.
          for attempt in $(seq 1 105); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&branch=main&event=push&per_page=20")"
            state="$(jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push")][0].status // "missing"' <<<"$runs")"
            conclusion="$(jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "main" and .event == "push")][0].conclusion // ""' <<<"$runs")"
            case "$state:$conclusion" in
              completed:success)
                echo "Full ResourcePortal CI + Installer succeeded for $GITHUB_SHA"
                exit 0 ;;
              completed:*)
                echo "Full CI on $GITHUB_SHA failed or was not successful: $conclusion" >&2
                exit 1 ;;
            esac
            echo "Waiting for complete main CI on $GITHUB_SHA (attempt $attempt, state: $state)"
            sleep 15
          done
          echo "Timed out waiting for main CI success on $GITHUB_SHA" >&2
          exit 1
      - name: Use validated release mode for this immutable revision
        id: release-mode
        env:
          MODE: ${{ needs.classify.outputs.mode }}
          PREVIOUS_TAG: ${{ needs.classify.outputs.previous_tag }}
        shell: bash
        run: |
          printf 'mode=%s\nprevious_tag=%s\n' "$MODE" "$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
      # Full source validation is enforced by exact-SHA post-merge CI above.
      # Pre-merge readiness already verifies targeted tests and applicable integrations.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate selected release version
        id: version
        env:
          VERSION: ${{ needs.classify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build installable CLI release asset
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          npm run build --workspace @resource-portal/sdk
          npm run build --workspace @resource-portal/cli
          rm -rf cli-release
          scripts/package-cli-release.sh \
            "$VERSION" \
            packages/resourceportal-cli/dist \
            packages/resourceportal-sdk/dist \
            cli-release
          (cd cli-release && sha256sum -c SHA256SUMS)
          verify_prefix="$(mktemp -d)"
          trap 'rm -rf "$verify_prefix"' EXIT
          npm install --global --prefix "$verify_prefix" "./cli-release/resource-portal-cli-${VERSION}.tgz" >/dev/null
          "$verify_prefix/bin/rp" --help >/dev/null
          "$verify_prefix/bin/resourceportal" --help >/dev/null
      - name: Validate actual RP release images recover before publishing
        env:
          PREVIOUS_TAG: ${{ steps.release-mode.outputs.previous_tag }}
          VERSION: ${{ steps.version.outputs.version }}
          VALIDATION_MODE: ${{ steps.release-mode.outputs.mode }}
          RP_ROLLBACK_E2E_ISOLATED: 'true'
          # Keep aligned with the signed published manifest image.
          RP_ROLLBACK_CANDIDATE_ZITADEL_IMAGE: ghcr.io/zitadel/zitadel:v4.17.0
        shell: bash
        run: |
          set -euo pipefail
          docker build -t resourceportal-api-candidate .
          docker build -t resourceportal-web-candidate -f packages/resourceportal-web/Dockerfile .
          docker build -t resourceportal-postgres-candidate -f packages/resourceportal-postgres/Dockerfile .
          # Certify each source independently with immutable official images.
          # Certify the immediate published source and independently test
          # still-installed older production sources, including 0.2.96.
          # Upgrade compatibility alone is NOT rollback certification: each
          # source must pass the real restore smoke and retain exact-SHA proof.
          mkdir -p "$RUNNER_TEMP/rollback-source-evidence"
          source_versions=("${PREVIOUS_TAG#v}" "0.2.96" "0.2.93" "0.2.92")
          certified=()
          for source_version in "${source_versions[@]}"; do
            [[ "$source_version" == "${PREVIOUS_TAG#v}" || "$source_version" == "0.2.96" || "$source_version" == "0.2.93" || "$source_version" == "0.2.92" ]] || exit 1
            # A source not earlier than the target release cannot be certified.
            [[ "$(printf '%s\n%s\n' "$source_version" "$VERSION" | sort -V | head -n 1)" == "$source_version" ]] || continue
            if [[ " ${certified[*]} " == *" $source_version "* ]]; then continue; fi
            certified+=("$source_version")
            source_file="$RUNNER_TEMP/rollback-source-evidence/$source_version.json"
            rm -f "$source_file"
            RP_ROLLBACK_EVIDENCE_OUTPUT="$source_file" bash scripts/run-automatic-rollback-smoke.sh "$source_version"
            test -s "$source_file"
            # Classify *this exact source*, refusing schema changes without
            # tested source DB restore and expand-only migration proof.
            policy_json="$(node scripts/release-rollback-policy.mjs \
              --previous-tag "v$source_version" --head HEAD --mode "$VALIDATION_MODE" \
              --verified-evidence-file "$source_file" --require-automatic)"
            jq -e --arg src "$source_version" --arg sha "$GITHUB_SHA" --argjson run "$GITHUB_RUN_ID" '
              .sourceVersion == $src and .targetCommit == $sha and
              .workflowRunId == $run and .kind == "real-upgrade-and-restore" and
              .actualDatabaseMigration == true and
              .previousImagesRestored == true and .injectedHealthFailure == true and
              .databaseSnapshotVerified == true and .databaseSnapshotRestored == true and
              .restoredSourceSchema == true and .previousApiReadWriteAfterRollback == true and
              .previousApiRuntimeReadyAfterRollback == true and
              .zitadelDatabaseRestored == true and .zitadelSourceRuntimeReadyAfterRollback == true and
              .zitadelSourceEventstoreVerified == true and
              .candidateZitadelRuntimeReadyBeforeRollback == true and
              (.candidateZitadelImage | test("^ghcr[.]io/zitadel/zitadel@sha256:[a-f0-9]{64}$")) and
              (.sourceZitadelImage | test("^ghcr[.]io/zitadel/zitadel@sha256:[a-f0-9]{64}$"))
            ' "$source_file"
            jq -n --slurpfile proof "$source_file" --argjson classification "$policy_json" '
              $proof[0] + {policy:$classification.policy,reason:$classification.reason}
            ' > "$RUNNER_TEMP/rollback-source-evidence/$source_version.certified.json"
          done
          # Keep original immediately-preceding-source proof for legacy fields.
          cp "$RUNNER_TEMP/rollback-source-evidence/${PREVIOUS_TAG#v}.json" "$RUNNER_TEMP/rp-rollback-evidence.json"
          certificate_files=()
          for source_version in "${certified[@]}"; do
            certificate_files+=("$RUNNER_TEMP/rollback-source-evidence/$source_version.certified.json")
          done
          jq -s '.' "${certificate_files[@]}" > "$RUNNER_TEMP/rp-rollback-certifications.json"
          # Fail closed rather than publish a manifest that will reject the
          # installed 0.2.96 fleet, even if another source was certified.
          jq -e --arg source "0.2.96" --arg commit "$GITHUB_SHA" '
            any(.[]; .sourceVersion == $source and .targetCommit == $commit and
              .kind == "real-upgrade-and-restore" and
              .actualDatabaseMigration == true and
              .previousImagesRestored == true and .injectedHealthFailure == true and
              .databaseSnapshotVerified == true and .databaseSnapshotRestored == true and
              .restoredSourceSchema == true and .previousApiReadWriteAfterRollback == true and
              .previousApiRuntimeReadyAfterRollback == true and
              .zitadelDatabaseRestored == true and .zitadelSourceRuntimeReadyAfterRollback == true and
              .zitadelSourceEventstoreVerified == true and
              .candidateZitadelRuntimeReadyBeforeRollback == true)
          ' "$RUNNER_TEMP/rp-rollback-certifications.json"
          jq -e --arg source "0.2.92" '
            any(.[]; .sourceVersion == $source)
          ' "$RUNNER_TEMP/rp-rollback-certifications.json"

      - name: Require verified automatic rollback before publishing
        env:
          PREVIOUS_TAG: ${{ steps.release-mode.outputs.previous_tag }}
          VALIDATION_MODE: ${{ steps.release-mode.outputs.mode }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release-rollback-policy.mjs \
            --previous-tag "$PREVIOUS_TAG" \
            --head HEAD \
            --mode "$VALIDATION_MODE" \
            --verified-evidence-file "$RUNNER_TEMP/rp-rollback-evidence.json" \
            --require-automatic
      # Publishing MUST reuse the exact Docker local candidates already run
      # by the real rollback gate. Independently rebuilding here breaks proof.
      - name: Publish rollback-tested API image
        id: api
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: bash scripts/publish-tested-release-image.sh api "$RELEASE_TAG"
      - name: Publish rollback-tested Web image
        id: web
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: bash scripts/publish-tested-release-image.sh web "$RELEASE_TAG"
      - name: Publish rollback-tested PostgreSQL image
        id: postgres
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: bash scripts/publish-tested-release-image.sh postgres "$RELEASE_TAG"
      - name: Resolve immutable upstream images
        shell: bash
        run: |
          set -euo pipefail
          # Resolve the candidate ZITADEL digest ONLY from the completed live
          # restore evidence, not by pulling a mutable upstream tag again.
          ZITADEL_REF="$(jq -er '.candidateZitadelImage' "$RUNNER_TEMP/rp-rollback-evidence.json")"
          [[ "$ZITADEL_REF" =~ ^ghcr\.io/zitadel/zitadel@sha256:[a-f0-9]{64}$ ]] || {
            echo "Release blocked: candidate ZITADEL image proof is missing" >&2; exit 1;
          }
          docker pull "$ZITADEL_REF"
          [[ "$(docker image inspect --format='{{index .RepoDigests 0}}' "$ZITADEL_REF")" == "$ZITADEL_REF" ]] || exit 1
          echo "ZITADEL_REF=$ZITADEL_REF" >> "$GITHUB_ENV"
          docker pull traefik:v3.6.16
          echo "TRAEFIK_REF=$(docker inspect --format='{{index .RepoDigests 0}}' traefik:v3.6.16)" >> "$GITHUB_ENV"
      - name: Classify database rollback capability (fail closed)
        id: rollback-assessment
        shell: bash
        env:
          PREVIOUS_TAG: ${{ steps.release-mode.outputs.previous_tag }}
          VALIDATION_MODE: ${{ steps.release-mode.outputs.mode }}
        run: |
          node scripts/release-rollback-policy.mjs \
            --previous-tag "$PREVIOUS_TAG" \
            --head HEAD \
            --mode "$VALIDATION_MODE" \
            --verified-evidence-file "$RUNNER_TEMP/rp-rollback-evidence.json" \
            --require-automatic \
            --github-output "$GITHUB_OUTPUT"
      - name: Create release manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          POSTGRES_DIGEST: ${{ steps.postgres.outputs.digest }}
          MIN_SUPPORTED_SOURCE_VERSION: "0.1.8"
          VALIDATION_MODE: ${{ steps.release-mode.outputs.mode }}
          PREVIOUS_TAG: ${{ steps.release-mode.outputs.previous_tag }}
        shell: bash
        run: |
          set -euo pipefail
          ROLLBACK_POLICY="${{ steps.rollback-assessment.outputs.rollback_policy }}"
          ROLLBACK_REASON="${{ steps.rollback-assessment.outputs.rollback_reason }}"
          ROLLBACK_SOURCE_VERSION="${{ steps.rollback-assessment.outputs.rollback_source_version }}"
          ROLLBACK_TARGET_COMMIT="${{ steps.rollback-assessment.outputs.rollback_target_commit }}"
          # Never publish a release manifest without automatic rollback.
          [[ "$ROLLBACK_POLICY" == image-only || "$ROLLBACK_POLICY" == tested ]] || {
            echo "Release blocked: rollbackPolicy=$ROLLBACK_POLICY" >&2
            exit 1
          }
          mapfile -t ancestor_versions < <(
            git tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' \
              | sed 's/^v//' \
              | grep -Fxv "$VERSION" \
              | sort -V
          )
          supported_versions=()
          for candidate in "${ancestor_versions[@]}"; do
            oldest="$(printf '%s\n%s\n' "$MIN_SUPPORTED_SOURCE_VERSION" "$candidate" | sort -V | head -n1)"
            [[ "$oldest" == "$MIN_SUPPORTED_SOURCE_VERSION" ]] || continue
            supported_versions+=("$candidate")
          done
          if (( ${#supported_versions[@]} == 0 )); then
            supported_versions=("$VERSION")
          fi
          SUPPORTED_FROM_VERSIONS="$(printf '%s\n' "${supported_versions[@]}" | jq -R . | jq -s .)"

          jq -n \
            --arg version "$VERSION" \
            --arg api "ghcr.io/${GITHUB_REPOSITORY_OWNER}/resourceportal-api@${API_DIGEST}" \
            --arg web "ghcr.io/${GITHUB_REPOSITORY_OWNER}/resourceportal-web@${WEB_DIGEST}" \
            --arg postgres "ghcr.io/${GITHUB_REPOSITORY_OWNER}/resourceportal-postgres@${POSTGRES_DIGEST}" \
            --arg zitadel "$ZITADEL_REF" \
            --arg traefik "$TRAEFIK_REF" \
            --arg rollback_policy "$ROLLBACK_POLICY" \
            --arg rollback_reason "$ROLLBACK_REASON" \
            --arg rollback_source_version "$ROLLBACK_SOURCE_VERSION" \
            --arg rollback_target_commit "$ROLLBACK_TARGET_COMMIT" \
            --argjson rollback_run_id "$GITHUB_RUN_ID" \
            --argjson supported_from_versions "$SUPPORTED_FROM_VERSIONS" \
            --slurpfile rollback_certificates "$RUNNER_TEMP/rp-rollback-certifications.json" \
            '{schemaVersion:1,version:$version,installer:{minimumVersion:"0.1.0"},docker:{minimumVersion:"27.0.0"},configSchemaVersion:1,images:{api:$api,web:$web,postgres:$postgres,zitadel:$zitadel,traefik:$traefik},migrations:{supportedFromVersions:$supported_from_versions,rollbackPolicy:$rollback_policy,rollbackAssessment:{reason:$rollback_reason,sourceVersion:$rollback_source_version,targetCommit:$rollback_target_commit}}}
             | .migrations.rollbackCertifiedSources=$rollback_certificates[0]
             | if $rollback_policy == "tested" then
                 .migrations.rollbackEvidence={kind:"real-upgrade-and-restore",workflowRunId:$rollback_run_id,sourceVersion:$rollback_source_version,databaseSnapshotRestored:true,restoredSourceSchema:true,zitadelDatabaseRestored:true,zitadelSourceRuntimeReadyAfterRollback:true,zitadelSourceEventstoreVerified:true,candidateZitadelRuntimeReadyBeforeRollback:true,candidateZitadelImage:$zitadel}
               else . end' \
            > resourceportal-release-manifest.json
      - name: Attest release manifest with GitHub Actions OIDC provenance
        id: manifest-attestation
        uses: actions/attest@v4
        with:
          subject-path: resourceportal-release-manifest.json
      - name: Bundle signed provenance for unauthenticated platform updaters
        env:
          ATTESTATION_BUNDLE: ${{ steps.manifest-attestation.outputs.bundle-path }}
        run: |
          set -euo pipefail
          test -s "$ATTESTATION_BUNDLE"
          cp "$ATTESTATION_BUNDLE" resourceportal-release-manifest.bundle.json
          test -s resourceportal-release-manifest.bundle.json
      - name: Verify the signed manifest against the official release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh attestation verify resourceportal-release-manifest.json \
            --repo re-invertion/resourcePortal \
            --signer-workflow re-invertion/resourcePortal/.github/workflows/release.yml \
            --source-ref refs/heads/main
      - name: Verify published images are anonymously pullable
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          POSTGRES_DIGEST: ${{ steps.postgres.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          for ref in \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/resourceportal-api@${API_DIGEST}" \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/resourceportal-web@${WEB_DIGEST}" \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/resourceportal-postgres@${POSTGRES_DIGEST}"; do
            docker buildx imagetools inspect "$ref" >/dev/null
          done

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            resourceportal-release-manifest.json
            resourceportal-release-manifest.bundle.json
            "cli-release/resource-portal-cli-${VERSION}.tgz"
            cli-release/SHA256SUMS
          )
          if [[ "$VERSION" == "0.2.71" ]]; then
            cp scripts/upgrade-recovery-from-0.2.68.sh resourceportal-upgrade-recovery.sh
            chmod 0755 resourceportal-upgrade-recovery.sh
            assets+=(resourceportal-upgrade-recovery.sh)
          fi
          # Never mutate an existing release or overwrite an orphaned tag.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists: immutable assets cannot be overwritten" >&2
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | grep -q .; then
            echo "Orphaned tag: stop for operator reconciliation" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --target "$GITHUB_SHA" --generate-notes --latest
          test "$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)" = "$RELEASE_TAG"
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"