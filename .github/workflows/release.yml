name: Installer-Gated Release

on:
  push:
    branches: [main]

# One publication per main revision; never cancel a publication in progress.
concurrency:
  group: resourceportal-automatic-main-release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.release-mode.outputs.mode }}
      version: ${{ steps.release-mode.outputs.version }}
      previous_tag: ${{ steps.release-mode.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve next version for this exact main commit
        id: release-mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/next-main-release.mjs --github-output "$GITHUB_OUTPUT"

  milestone-swarm:
    needs: classify
    if: needs.classify.outputs.mode == 'milestone'
    uses: ./.github/workflows/swarm-integration.yml
    with:
      force_gate: true

  milestone-federation:
    needs: classify
    if: needs.classify.outputs.mode == 'milestone'
    uses: ./.github/workflows/federation-integration.yml
    with:
      force_gate: true

  milestone-installer:
    needs: classify
    if: needs.classify.outputs.mode == 'milestone'
    uses: ./.github/workflows/production-installer.yml
    with:
      force_gate: true

  publish:
    needs: [classify, milestone-swarm, milestone-federation, milestone-installer]
    if: >-
      always() && needs.classify.result == 'success' &&
      (needs.milestone-swarm.result == 'success' || (needs.classify.outputs.mode == 'fastfix' && needs.milestone-swarm.result == 'skipped')) &&
      (needs.milestone-federation.result == 'success' || (needs.classify.outputs.mode == 'fastfix' && needs.milestone-federation.result == 'skipped')) &&
      (needs.milestone-installer.result == 'success' || (needs.classify.outputs.mode == 'fastfix' && needs.milestone-installer.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Setup Node for Production Installer gate
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Verify test inventory and taxonomy
        run: npm run test:catalog
      - name: Use the classification validated for this exact main revision
        id: release-mode
        env:
          MODE: ${{ needs.classify.outputs.mode }}
          PREVIOUS_TAG: ${{ needs.classify.outputs.previous_tag }}
        shell: bash
        run: |
          printf 'mode=%s\nprevious_tag=%s\n' "$MODE" "$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"
      - name: Validate only changed scope for patch release
        if: steps.release-mode.outputs.mode == 'fastfix'
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://resource_portal:resource_portal@localhost:5432/resource_portal?schema=public
          AUTH_MODE: dev
          RESOURCE_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          PREVIOUS_TAG: ${{ steps.release-mode.outputs.previous_tag }}
        run: node scripts/fastfix-test-plan.mjs --base "$PREVIOUS_TAG" --head HEAD --run
      - name: Full lint, test and build gates for milestone release
        if: steps.release-mode.outputs.mode == 'milestone'
        env:
          NODE_ENV: test
          AUTH_MODE: dev
        run: |
          npm run lint
          npm run test
          npm run build
      - name: Validate Production Installer contracts for milestone release
        if: steps.release-mode.outputs.mode == 'milestone'
        run: npm run test:installer
      - name: Validate installable CLI release package before publishing
        run: npm run test:cli-release
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate selected version
        id: version
        env:
          VERSION: ${{ needs.classify.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build installable CLI release asset
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          npm run build --workspace @resource-portal/sdk
          npm run build --workspace @resource-portal/cli
          rm -rf cli-release
          scripts/package-cli-release.sh \
            "$VERSION" \
            packages/resourceportal-cli/dist \
            packages/resourceportal-sdk/dist \
            cli-release
          (cd cli-release && sha256sum -c SHA256SUMS)
          verify_prefix="$(mktemp -d)"
          trap 'rm -rf "$verify_prefix"' EXIT
          npm install --global --prefix "$verify_prefix" "./cli-release/resource-portal-cli-${VERSION}.tgz" >/dev/null
          "$verify_prefix/bin/rp" --help >/dev/null
          "$verify_prefix/bin/resourceportal" --help >/dev/null
      - name: Build and publish API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/resourceportal-api:${{ steps.version.outputs.tag }}
      - name: Build and publish Web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/resourceportal-web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/resourceportal-web:${{ steps.version.outputs.tag }}
      - name: Build and publish fenced PostgreSQL image
        id: postgres
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/resourceportal-postgres/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/resourceportal-postgres:${{ steps.version.outputs.tag }}
      - name: Resolve immutable upstream images
        shell: bash
        run: |
          set -euo pipefail
          for image in ghcr.io/zitadel/zitadel:v4.17.0 traefik:v3.6.16; do docker pull "$image"; done
          echo "ZITADEL_REF=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/zitadel/zitadel:v4.17.0)" >> "$GITHUB_ENV"
          echo "TRAEFIK_REF=$(docker inspect --format='{{index .RepoDigests 0}}' traefik:v3.6.16)" >> "$GITHUB_ENV"
      - name: Classify database rollback capability (fail closed)
        id: rollback-assessment
        shell: bash
        env:
          PREVIOUS_TAG: ${{ steps.release-mode.outputs.previous_tag }}
          VALIDATION_MODE: ${{ steps.release-mode.outputs.mode }}
        run: |
          node scripts/release-rollback-policy.mjs \
            --previous-tag "$PREVIOUS_TAG" \
            --head HEAD \
            --mode "$VALIDATION_MODE" \
            --github-output "$GITHUB_OUTPUT"
      - name: Create release manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          POSTGRES_DIGEST: ${{ steps.postgres.outputs.digest }}
          MIN_SUPPORTED_SOURCE_VERSION: "0.1.8"
          VALIDATION_MODE: ${{ steps.release-mode.outputs.mode }}
          PREVIOUS_TAG: ${{ steps.release-mode.outputs.previous_tag }}
        shell: bash
        run: |
          set -euo pipefail
          ROLLBACK_POLICY="${{ steps.rollback-assessment.outputs.rollback_policy }}"
          ROLLBACK_REASON="${{ steps.rollback-assessment.outputs.rollback_reason }}"
          ROLLBACK_SOURCE_VERSION="${{ steps.rollback-assessment.outputs.rollback_source_version }}"
          ROLLBACK_TARGET_COMMIT="${{ steps.rollback-assessment.outputs.rollback_target_commit }}"
          [[ "$ROLLBACK_POLICY" == image-only || "$ROLLBACK_POLICY" == none ]] || exit 1
          mapfile -t ancestor_versions < <(
            git tag --merged HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' \
              | sed 's/^v//' \
              | grep -Fxv "$VERSION" \
              | sort -V
          )
          supported_versions=()
          for candidate in "${ancestor_versions[@]}"; do
            oldest="$(printf '%s\n%s\n' "$MIN_SUPPORTED_SOURCE_VERSION" "$candidate" | sort -V | head -n1)"
            [[ "$oldest" == "$MIN_SUPPORTED_SOURCE_VERSION" ]] || continue
            supported_versions+=("$candidate")
          done
          if (( ${#supported_versions[@]} == 0 )); then
            supported_versions=("$VERSION")
          fi
          SUPPORTED_FROM_VERSIONS="$(printf '%s\n' "${supported_versions[@]}" | jq -R . | jq -s .)"

          jq -n \
            --arg version "$VERSION" \
            --arg api "ghcr.io/${GITHUB_REPOSITORY_OWNER}/resourceportal-api@${API_DIGEST}" \
            --arg web "ghcr.io/${GITHUB_REPOSITORY_OWNER}/resourceportal-web@${WEB_DIGEST}" \
            --arg postgres "ghcr.io/${GITHUB_REPOSITORY_OWNER}/resourceportal-postgres@${POSTGRES_DIGEST}" \
            --arg zitadel "$ZITADEL_REF" \
            --arg traefik "$TRAEFIK_REF" \
            --arg rollback_policy "$ROLLBACK_POLICY" \
            --arg rollback_reason "$ROLLBACK_REASON" \
            --arg rollback_source_version "$ROLLBACK_SOURCE_VERSION" \
            --arg rollback_target_commit "$ROLLBACK_TARGET_COMMIT" \
            --argjson supported_from_versions "$SUPPORTED_FROM_VERSIONS" \
            '{schemaVersion:1,version:$version,installer:{minimumVersion:"0.1.0"},docker:{minimumVersion:"27.0.0"},configSchemaVersion:1,images:{api:$api,web:$web,postgres:$postgres,zitadel:$zitadel,traefik:$traefik},migrations:{supportedFromVersions:$supported_from_versions,rollbackPolicy:$rollback_policy,rollbackAssessment:{reason:$rollback_reason,sourceVersion:$rollback_source_version,targetCommit:$rollback_target_commit}}}' \
            > resourceportal-release-manifest.json
      - name: Verify published images are anonymously pullable
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          POSTGRES_DIGEST: ${{ steps.postgres.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          for ref in \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/resourceportal-api@${API_DIGEST}" \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/resourceportal-web@${WEB_DIGEST}" \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/resourceportal-postgres@${POSTGRES_DIGEST}"; do
            docker buildx imagetools inspect "$ref" >/dev/null
          done

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            resourceportal-release-manifest.json
            "cli-release/resource-portal-cli-${VERSION}.tgz"
            cli-release/SHA256SUMS
          )
          if [[ "$VERSION" == "0.2.71" ]]; then
            cp scripts/upgrade-recovery-from-0.2.68.sh resourceportal-upgrade-recovery.sh
            chmod 0755 resourceportal-upgrade-recovery.sh
            assets+=(resourceportal-upgrade-recovery.sh)
          fi
          # Create the tag/release only after all gates, builds and public-pull checks.
          # Never mutate or overwrite an earlier release, even after partial failure.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already published: immutable artifacts may not be overwritten" >&2
            exit 1
          fi
          if git ls-remote --tags origin "refs/tags/$RELEASE_TAG" | grep -q .; then
            echo "Tag exists without a completed release; reconcile before publishing" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "${assets[@]}" \
            --target "$GITHUB_SHA" --generate-notes --latest
          test "$(gh release view "$RELEASE_TAG" --json tagName --jq .tagName)" = "$RELEASE_TAG"
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"