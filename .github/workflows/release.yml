name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate semantic tag
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build and publish API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/resourceportal-api:${{ github.ref_name }}
      - name: Build and publish Web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/resourceportal-web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/resourceportal-web:${{ github.ref_name }}
      - name: Resolve immutable upstream images
        shell: bash
        run: |
          set -euo pipefail
          for image in postgres:17-alpine ghcr.io/zitadel/zitadel:v4.0.0 traefik:v3.5; do docker pull "$image"; done
          echo "POSTGRES_REF=$(docker inspect --format='{{index .RepoDigests 0}}' postgres:17-alpine)" >> "$GITHUB_ENV"
          echo "ZITADEL_REF=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/zitadel/zitadel:v4.0.0)" >> "$GITHUB_ENV"
          echo "TRAEFIK_REF=$(docker inspect --format='{{index .RepoDigests 0}}' traefik:v3.5)" >> "$GITHUB_ENV"
      - name: Create release manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
        shell: bash
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg api "ghcr.io/${GITHUB_REPOSITORY_OWNER}/resourceportal-api@${API_DIGEST}" \
            --arg web "ghcr.io/${GITHUB_REPOSITORY_OWNER}/resourceportal-web@${WEB_DIGEST}" \
            --arg postgres "$POSTGRES_REF" --arg zitadel "$ZITADEL_REF" --arg traefik "$TRAEFIK_REF" \
            '{schemaVersion:1,version:$version,installer:{minimumVersion:"0.1.0"},docker:{minimumVersion:"27.0.0"},configSchemaVersion:1,images:{api:$api,web:$web,postgres:$postgres,zitadel:$zitadel,traefik:$traefik},migrations:{supportedFromVersions:["0.1.0"],rollbackPolicy:"none"}}' \
            > resourceportal-release-manifest.json
      - name: Publish GitHub Release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" resourceportal-release-manifest.json --clobber
          else
            gh release create "$GITHUB_REF_NAME" resourceportal-release-manifest.json --generate-notes
          fi
