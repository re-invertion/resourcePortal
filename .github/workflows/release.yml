name: Installer-Gated Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic release version to republish (for example 0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node for Production Installer gate
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Node dependencies
        run: npm ci
      - name: Validate Production Installer contracts before publishing
        run: npm run test:installer
      - name: Validate installable CLI release package before publishing
        run: npm run test:cli-release
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate semantic tag
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$MANUAL_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build installable CLI release asset
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          npm run build --workspace @resource-portal/sdk
          npm run build --workspace @resource-portal/cli
          rm -rf cli-release
          scripts/package-cli-release.sh \
            "$VERSION" \
            packages/resourceportal-cli/dist \
            packages/resourceportal-sdk/dist \
            cli-release
          (cd cli-release && sha256sum -c SHA256SUMS)
          verify_prefix="$(mktemp -d)"
          trap 'rm -rf "$verify_prefix"' EXIT
          npm install --global --prefix "$verify_prefix" "./cli-release/resource-portal-cli-${VERSION}.tgz" >/dev/null
          "$verify_prefix/bin/rp" --help >/dev/null
          "$verify_prefix/bin/resourceportal" --help >/dev/null
      - name: Build and publish API image
        id: api
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/resourceportal-api:${{ steps.version.outputs.tag }}
      - name: Build and publish Web image
        id: web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/resourceportal-web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/resourceportal-web:${{ steps.version.outputs.tag }}
      - name: Build and publish fenced PostgreSQL image
        id: postgres
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/resourceportal-postgres/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/resourceportal-postgres:${{ steps.version.outputs.tag }}
      - name: Resolve immutable upstream images
        shell: bash
        run: |
          set -euo pipefail
          for image in ghcr.io/zitadel/zitadel:v4.0.0 traefik:v3.6.16; do docker pull "$image"; done
          echo "ZITADEL_REF=$(docker inspect --format='{{index .RepoDigests 0}}' ghcr.io/zitadel/zitadel:v4.0.0)" >> "$GITHUB_ENV"
          echo "TRAEFIK_REF=$(docker inspect --format='{{index .RepoDigests 0}}' traefik:v3.6.16)" >> "$GITHUB_ENV"
      - name: Create release manifest
        env:
          VERSION: ${{ steps.version.outputs.version }}
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          POSTGRES_DIGEST: ${{ steps.postgres.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          release_series="${VERSION%.*}"
          mapfile -t supported_versions < <(
            git tag --merged HEAD --list 'v*' \
              | sed 's/^v//' \
              | grep -E "^${release_series//./\.}\.[0-9]+$" \
              | grep -Fxv "$VERSION" \
              | sort -V
          )
          if (( ${#supported_versions[@]} == 0 )); then
            supported_versions=("$VERSION")
          fi
          SUPPORTED_FROM_VERSIONS="$(printf '%s\n' "${supported_versions[@]}" | jq -R . | jq -s .)"

          jq -n \
            --arg version "$VERSION" \
            --arg api "ghcr.io/${GITHUB_REPOSITORY_OWNER}/resourceportal-api@${API_DIGEST}" \
            --arg web "ghcr.io/${GITHUB_REPOSITORY_OWNER}/resourceportal-web@${WEB_DIGEST}" \
            --arg postgres "ghcr.io/${GITHUB_REPOSITORY_OWNER}/resourceportal-postgres@${POSTGRES_DIGEST}" \
            --arg zitadel "$ZITADEL_REF" \
            --arg traefik "$TRAEFIK_REF" \
            --argjson supported_from_versions "$SUPPORTED_FROM_VERSIONS" \
            '{schemaVersion:1,version:$version,installer:{minimumVersion:"0.1.0"},docker:{minimumVersion:"27.0.0"},configSchemaVersion:1,images:{api:$api,web:$web,postgres:$postgres,zitadel:$zitadel,traefik:$traefik},migrations:{supportedFromVersions:$supported_from_versions,rollbackPolicy:"none"}}' \
            > resourceportal-release-manifest.json
      - name: Verify published images are anonymously pullable
        env:
          API_DIGEST: ${{ steps.api.outputs.digest }}
          WEB_DIGEST: ${{ steps.web.outputs.digest }}
          POSTGRES_DIGEST: ${{ steps.postgres.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io || true
          for ref in \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/resourceportal-api@${API_DIGEST}" \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/resourceportal-web@${WEB_DIGEST}" \
            "ghcr.io/${GITHUB_REPOSITORY_OWNER}/resourceportal-postgres@${POSTGRES_DIGEST}"; do
            docker buildx imagetools inspect "$ref" >/dev/null
          done

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            resourceportal-release-manifest.json
            "cli-release/resource-portal-cli-${VERSION}.tgz"
            cli-release/SHA256SUMS
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --generate-notes
          fi
