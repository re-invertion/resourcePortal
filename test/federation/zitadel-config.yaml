Log:
  Level: warn

Port: 8080
ExternalDomain: localhost
ExternalPort: 8080
ExternalSecure: false

TLS:
  Enabled: false

Projections:
  # Production defaults to 60s sweeps and a 1m transaction window. Keep the
  # isolated live integration stack responsive while preserving the real
  # event-store -> projection path.
  RequeueEvery: 1s
  TransactionDuration: 2s

Database:
  postgres:
    Host: localhost
    Port: 55433
    Database: zitadel
    User:
      SSL:
        Mode: disable
    Admin:
      SSL:
        Mode: disable
