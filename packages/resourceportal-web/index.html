<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resource Portal</title>
    <style type="text/tailwindcss">
      @layer base {
        body {
          @apply min-h-screen bg-slate-50 text-slate-900 antialiased;
        }

        #root {
          @apply min-h-screen;
        }

        #root > header {
          @apply flex flex-wrap items-center gap-4 border-b border-slate-200 bg-white px-6 py-4 shadow-sm;
        }

        #root > header strong {
          @apply mr-auto text-lg;
        }

        #root > nav {
          @apply flex flex-wrap gap-x-3 gap-y-2 border-b border-slate-200 bg-slate-100 px-6 py-3 text-sm;
        }

        main {
          @apply mx-auto w-full max-w-screen-2xl p-6;
        }

        section {
          @apply my-4 rounded-lg border border-slate-200 bg-white p-4 shadow-sm;
        }

        section > header {
          @apply mb-4 flex flex-wrap items-start gap-3 border-b border-slate-100 pb-3;
        }

        section > header h2 {
          @apply mr-auto;
        }

        h1 {
          @apply mb-4 text-2xl font-semibold tracking-tight;
        }

        h2 {
          @apply text-lg font-semibold tracking-tight;
        }

        p {
          @apply my-2 text-sm leading-6 text-slate-700;
        }

        a {
          @apply font-medium text-blue-700 underline-offset-2;
        }

        a:hover {
          @apply underline;
        }

        button {
          @apply inline-flex min-h-9 items-center justify-center rounded-md border border-slate-300 bg-white px-3 py-1.5 text-sm font-medium text-slate-800 shadow-sm;
        }

        button:hover:not(:disabled) {
          @apply bg-slate-100;
        }

        button:focus-visible,
        a:focus-visible,
        textarea:focus-visible,
        input:focus-visible,
        select:focus-visible,
        summary:focus-visible {
          @apply outline-2 outline-offset-2 outline-blue-600;
        }

        button:disabled {
          @apply cursor-not-allowed opacity-50;
        }

        form {
          @apply my-3 space-y-3;
        }

        label {
          @apply grid gap-2 text-sm font-medium text-slate-800;
        }

        textarea,
        input,
        select {
          @apply w-full rounded-md border border-slate-300 bg-white px-3 py-2 font-mono text-sm text-slate-900 shadow-inner;
        }

        textarea {
          @apply min-h-44 resize-y;
        }

        table {
          @apply my-3 w-full border-collapse text-left text-sm;
        }

        thead {
          @apply bg-slate-100;
        }

        th {
          @apply border border-slate-200 px-3 py-2 font-semibold text-slate-700;
        }

        td {
          @apply border border-slate-200 px-3 py-2 align-top text-slate-700;
        }

        td:last-child {
          @apply space-x-2;
        }

        details {
          @apply my-2 rounded-md border border-slate-200 bg-slate-50 p-2;
        }

        summary {
          @apply cursor-pointer text-sm font-medium text-slate-800;
        }

        pre {
          @apply my-3 max-w-full overflow-auto rounded-md bg-slate-950 p-3 text-xs leading-5 text-slate-100;
        }

        code {
          @apply rounded bg-slate-100 px-1 py-0.5 font-mono text-xs;
        }

        [role="alert"] {
          @apply my-3 rounded-md border border-red-200 bg-red-50 p-3 text-sm text-red-800;
        }

        ul {
          @apply my-3 space-y-2;
        }
      }

      @layer components {
        .rp-table-scroll {
          @apply w-full overflow-x-auto;
        }

        .rp-list-toolbar {
          @apply my-3 grid gap-3 rounded-md border border-slate-200 bg-slate-50 p-3 md:grid-cols-2;
        }

        .rp-primary-actions {
          @apply flex flex-wrap items-center gap-2;
        }

        .rp-primary-actions > details,
        .rp-row-actions {
          @apply my-0 inline-block;
        }

        .rp-row-actions > div {
          @apply mt-2 flex min-w-48 flex-col gap-2;
        }

        .rp-row-actions > div > details {
          @apply my-0;
        }

        .rp-empty-state {
          @apply my-4 rounded-md border border-dashed border-slate-300 bg-slate-50 p-6 text-center;
        }

        .rp-empty-state p {
          @apply mb-3 text-slate-600;
        }

        .rp-success-message {
          @apply my-3 rounded-md border border-green-200 bg-green-50 p-3 text-sm font-medium text-green-800;
        }

        .rp-selected-resource {
          @apply my-3 flex flex-wrap items-center gap-3 rounded-md border border-blue-200 bg-blue-50 p-3;
        }

        .rp-selected-resource p {
          @apply mr-auto my-0 text-blue-900;
        }

        .rp-dialog-backdrop {
          @apply fixed inset-0 z-50 flex items-center justify-center bg-slate-950/40 p-4;
        }

        .rp-confirm-dialog {
          @apply m-0 w-full max-w-md rounded-lg border border-slate-200 bg-white p-5 shadow-xl;
        }

        .rp-confirm-dialog h2 {
          @apply mb-2;
        }

        .rp-dialog-actions {
          @apply mt-4 flex justify-end gap-2;
        }

        .rp-readable-data {
          @apply my-3 space-y-3;
        }

        .rp-data-grid {
          @apply grid grid-cols-1 gap-3 md:grid-cols-2 xl:grid-cols-3;
        }

        .rp-data-field {
          @apply min-w-0 rounded-md border border-slate-200 bg-white p-3;
        }

        .rp-data-field dt {
          @apply mb-1 text-xs font-semibold uppercase tracking-wide text-slate-500;
        }

        .rp-data-field dd {
          @apply break-words text-sm text-slate-900;
        }

        .rp-data-muted {
          @apply text-sm italic text-slate-500;
        }

        .rp-data-nested {
          @apply my-3 rounded-md border border-slate-200 bg-slate-50 p-3 shadow-none;
        }

        .rp-data-nested h3 {
          @apply mb-2 text-sm font-semibold text-slate-800;
        }

        .rp-data-chip-list {
          @apply my-2 flex flex-wrap gap-2 space-y-0;
        }

        .rp-data-chip-list li {
          @apply rounded-full bg-slate-100 px-2.5 py-1 text-xs text-slate-700;
        }

        .rp-data-card-list {
          @apply grid gap-3 lg:grid-cols-2;
        }

        .rp-data-card {
          @apply rounded-md border border-slate-200 bg-white p-3;
        }

        .rp-status-pill {
          @apply inline-flex items-center rounded-full px-2.5 py-1 text-xs font-semibold;
        }

        .rp-status-pill[data-tone="positive"] {
          @apply bg-green-100 text-green-800;
        }

        .rp-status-pill[data-tone="warning"] {
          @apply bg-amber-100 text-amber-800;
        }

        .rp-status-pill[data-tone="negative"] {
          @apply bg-red-100 text-red-800;
        }

        .rp-status-pill[data-tone="neutral"] {
          @apply bg-slate-100 text-slate-700;
        }

        .rp-technical-json {
          @apply mt-3 border-dashed bg-white;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
